name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

# Needed so the build can publish a public Release with the APKs attached.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Basket APK (shared list)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleSharedDebug --no-daemon
          cp app/build/outputs/apk/shared/debug/app-shared-debug.apk ../Basket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basket-apk
          path: Basket.apk

      # Basket Solo: the standalone edition that keeps the list on the phone (no Firebase).
      - name: Build Solo web app
        run: npm run build:solo

      - name: Check the Solo build contains no Firebase
        run: "! grep -rlE 'firestore|identitytoolkit' dist/"

      - name: Build Basket Solo APK
        run: |
          npx cap sync android
          cd android
          ./gradlew assembleSoloDebug --no-daemon
          cp app/build/outputs/apk/solo/debug/app-solo-debug.apk ../BasketSolo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: basket-solo-apk
          path: BasketSolo.apk

      # Publish both APKs as a public Release. Unlike artifacts, Release files can be
      # downloaded by anyone without a GitHub account. Only for pushes to the default branch.
      - name: Publish release
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Basket.apk BasketSolo.apk \
            --target "${{ github.sha }}" \
            --title "Basket build ${{ github.run_number }}" \
            --notes "Basket.apk is the shared list. BasketSolo.apk is the standalone version that keeps the list on the phone. Download on your phone and open it to install." \
            --latest
